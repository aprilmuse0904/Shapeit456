<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shape It! 4 - Units 4 5 6 - Spidergrams & Grammar</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17213a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#14213d;color:#fff;padding:28px max(20px,calc((100vw - 1200px)/2))}header h1{margin:0;font-size:clamp(24px,3vw,38px)}header p{opacity:.85;margin:8px 0 0}.container{max-width:1200px;margin:auto;padding:22px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.tab{padding:12px 18px;border-radius:14px;border:1px solid #d2d9ea;background:#fff;cursor:pointer;font-weight:750}.tab.active{background:var(--accent);color:white;border-color:var(--accent)}.hero{background:white;border-radius:22px;padding:24px;margin:10px 0 22px;box-shadow:0 3px 18px #1020300b}.hero h2{font-size:27px;margin:4px 0}.hero small{font-weight:700;color:var(--accent)}.section-title{margin:26px 0 14px;font-size:21px}.map{position:relative;min-height:400px;display:grid;grid-template-columns:1fr 220px 1fr;grid-template-rows:auto auto;gap:18px;align-items:center}.branch{background:#fff;border:2px solid #dfe5ef;border-left:7px solid var(--accent);border-radius:19px;padding:18px 20px;box-shadow:0 4px 12px #14213d0b;position:relative;z-index:2}.branch:nth-child(1){grid-column:1;grid-row:1}.branch:nth-child(2){grid-column:3;grid-row:1}.branch:nth-child(3){grid-column:1/4;grid-row:2;max-width:610px;justify-self:center;width:100%}.branch h3{margin:0 0 10px;font-size:17px}.words{display:flex;gap:7px;flex-wrap:wrap}.word{font-size:13px;background:#f0f3f8;padding:6px 9px;border-radius:8px}.center{grid-column:2;grid-row:1;justify-self:center;border-radius:50%;height:194px;width:194px;display:flex;justify-content:center;align-items:center;text-align:center;font-weight:900;font-size:20px;background:var(--accent);color:#fff;padding:22px;box-shadow:0 8px 26px #27364833;position:relative;z-index:1}.map:before{content:'';position:absolute;inset:22% 14% 24%;border:3px dashed var(--accent);border-radius:45%;opacity:.15}.context-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.context{padding:20px;border-radius:16px;background:#fff;border:1px solid #dfe5ef;line-height:1.7}.context strong{color:var(--accent)}.context h3{margin:0 0 7px;font-size:16px}.context .tip{font-size:12px;color:#64748b;margin-top:12px}.grammar{background:#fff;border:1px solid #dfe5ef;border-radius:18px;margin:16px 0;padding:22px}.grammar h3{margin-top:0;color:var(--accent)}.forms{background:#f4f7fd;padding:12px 16px;border-radius:12px;line-height:1.9}.eg{margin-top:13px}.question{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-top:1px dashed #dde4ee;padding:12px 0}.question label{flex:1;min-width:240px}.question input{padding:10px 12px;border:1px solid #b7c3d5;border-radius:9px;min-width:190px;flex:0 1 250px;font:inherit}.question.correct input{border:2px solid #16865e}.question.wrong input{border:2px solid #ca3646}.feedback{font-size:12px;font-weight:700}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}button.action{border:0;border-radius:10px;padding:12px 15px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#e9eef8;color:#23344f}.score{font-weight:800;padding:9px}.note{font-size:14px;color:#586782}.hide{display:none}@media(max-width:850px){.map{display:flex;flex-direction:column}.center{order:-1;width:160px;height:160px;min-height:160px}.branch{width:100%;max-width:none!important}.context-grid{grid-template-columns:1fr}header{padding:22px}.container{padding:14px}}@media print{header,.tabs,.actions{display:none!important}.hide{display:block}body{background:white}.grammar,.branch,.context{break-inside:avoid}input{border:none;border-bottom:1px solid #888;border-radius:0}.container{max-width:none}}
</style></head><body><header><h1>SHAPE IT! 4 · Vocabulary Spidergrams</h1><p>Units 4–6 · A2–B1 · Vocabulary · Contexts · Grammar · Interactive Practice</p></header><main class="container"><nav id="tabs" class="tabs"></nav><div id="app"></div></main><script>
const DATA=[{"id": 4, "title": "How do you use your senses?", "subtitle": "The Five Senses · Describing Texture, Sound, Taste", "color": "#0f8b8d", "branches": [{"title": "The five senses", "emoji": "👁️", "words": ["sight / see / look at", "hearing / hear / listen to", "smell / smell", "taste / taste", "touch / feel"], "context": "We use our **five senses** to understand the world. We **see** colorful pictures with our eyes, **hear** music with our ears, and **smell** food with our noses. We **taste** sweet or spicy food with our tongues and **feel** different textures with our hands."}, {"title": "Describing what we sense", "emoji": "🎨", "words": ["smooth ↔ rough", "soft ↔ hard", "shiny ↔ dull", "colorful / transparent", "spicy / bitter / sour / sweet", "salty / delicious", "loud / quiet", "slimy / sticky"], "context": "A lemon looks **colorful**, but it tastes **sour**. A mirror is **smooth** and **shiny**, while a rock can be **rough** and **hard**. A chili pepper tastes **spicy**. Some animals have **slimy** skin, but others have **soft** fur. Descriptive words help people imagine how things look, sound, smell, taste, and feel."}, {"title": "Safety and sensory experiences", "emoji": "🛡️", "words": ["feel pain / fear", "be scared of", "be worried about", "notice a danger", "protect your eyes", "avoid loud noises", "take care of your senses"], "context": "Our senses help us **notice danger** and stay safe. We **feel pain** when something hurts, and this warns us to stop. We should **protect our eyes** from bright light, **avoid loud noises**, and **take care of our senses** every day. Fear can also warn us about risky situations."}], "grammar": [{"title": "Grammar 1 · Modals of deduction and possibility", "rule": "Use must for strong certainty; might / may / could for possibility; can’t for strong negative certainty. These are deductions, not rules.", "forms": ["S + must + V (very likely)", "S + might / may / could + V (possible)", "S + can’t + V (almost impossible)"], "examples": ["It **must be** a violin. I can hear strings.", "The picture **might be** a painting.", "He **can’t be** at home; I just saw him at school."], "qs": [["She has studied all night. She ___ tired.", "must be"], ["I am not sure. This food ___ spicy.", "might be"], ["That ___ a real elephant. It is made of plastic.", "can’t be"], ["The lights are off. They ___ asleep.", "might be"], ["You scored 100%. You ___ proud!", "must be"], ["He is only five. He ___ the principal.", "can’t be"]]}, {"title": "Grammar 2 · Obligation, prohibition, necessity and advice", "rule": "must / have to express obligation; mustn’t prohibits; don’t have to / don’t need to mean no necessity; should / ought to give advice; had to expresses past obligation.", "forms": ["must / have to + V", "mustn’t + V ≠ don’t have to + V", "should / ought to + V", "had to / didn’t have to + V"], "examples": ["You **must wear** a helmet.", "You **mustn’t touch** that machine.", "You **don’t have to bring** a camera.", "You **should protect** your hearing.", "Yesterday I **had to finish** my project."], "qs": [["It is forbidden to feed the animals. You ___ feed them.", "mustn’t"], ["The museum is free. You ___ pay.", "don’t have to"], ["It is a good idea to rest. You ___ rest.", "should"], ["The rule says everyone ___ wear a seat belt.", "must"], ["Yesterday it was compulsory to arrive early. We ___ arrive early.", "had to"], ["You ___ listen to music loudly; it can damage your ears.", "shouldn’t"]]}]}, {"id": 5, "title": "What amazes you?", "subtitle": "Processes · Smart Cities · Natural Wonders", "color": "#7c3aed", "branches": [{"title": "Processes and nature", "emoji": "🐝", "words": ["attract bees / insects", "collect nectar / food", "produce honey / silk", "develop a skill / a product", "communicate with others", "deliver a message / package", "solve a problem", "measure distance / temperature"], "context": "Bees **collect nectar** from flowers and **produce honey**. Flowers **attract** insects with their colors. Animals **communicate** in many ways. Scientists **measure** changes in nature and try to **solve problems**. New inventions are **developed** to help people live more comfortably."}, {"title": "Smart cities of the future", "emoji": "🏙️", "words": ["smart city / connected devices", "deliver packages by drone", "self-driving / driverless car", "save energy", "reduce pollution", "waste / recycle waste", "solar-powered buildings", "the Internet of Things (IoT)"], "context": "In a **smart city**, information is shared by **connected devices**. Packages may be **delivered by drones**, and **driverless cars** may reduce traffic. Energy can be **saved** by smart technology. Waste is **recycled** to help **reduce pollution**. These systems may make daily life easier."}, {"title": "Amazing places & reactions", "emoji": "🌋", "words": ["stunning / fascinating", "enormous / tiny", "terrifying / frightening", "freezing / boiling", "deafening / silent", "breathtaking scenery", "be impressed by", "be amazed at"], "context": "The waterfall was **stunning**, and the mountains were **enormous**. The water was **freezing**, but the afternoon was **boiling** hot. The noise was **deafening**. We were **amazed at** the scenery and **impressed by** the beautiful views. The whole trip was **fascinating**."}], "grammar": [{"title": "Grammar 1 · The passive voice (present, past and future)", "rule": "Use passive when the action/result matters more than who does it. Object of active sentence becomes subject of passive. Include “by + agent” only when necessary.", "forms": ["Present: am / is / are + V3", "Past: was / were + V3", "Future: will be + V3"], "examples": ["Bees **produce** honey. → Honey **is produced** by bees.", "People **built** the bridge. → The bridge **was built**.", "Robots **will deliver** packages. → Packages **will be delivered** by robots."], "qs": [["Honey ___ (produce) by bees.", "is produced"], ["The Eiffel Tower ___ (build) in the 19th century.", "was built"], ["More smart houses ___ (build) in the future.", "will be built"], ["English ___ (speak) in many countries.", "is spoken"], ["The first computers ___ (invent) decades ago.", "were invented"], ["The results ___ (announce) tomorrow.", "will be announced"]]}, {"title": "Grammar 2 · Question tags", "rule": "Positive statement → negative tag. Negative statement → positive tag. Match auxiliary verb, tense and pronoun. With “I am”, use “aren’t I?”.", "forms": ["She is here, isn’t she?", "They don’t drive, do they?", "You went there, didn’t you?", "We will win, won’t we?"], "examples": ["It’s beautiful, **isn’t it?**", "You haven’t seen it, **have you?**", "They can swim, **can’t they?**"], "qs": [["You love science, ___?", "don’t you"], ["The city was built long ago, ___?", "wasn’t it"], ["They won’t leave early, ___?", "will they"], ["She can speak Spanish, ___?", "can’t she"], ["We have finished, ___?", "haven’t we"], ["He didn’t call, ___?", "did he"]]}]}, {"id": 6, "title": "When do you push the limits?", "subtitle": "Collocations · Risks · Inspiration and Challenges", "color": "#df5b2e", "branches": [{"title": "Collocations with get, take, have", "emoji": "🎯", "words": ["get involved in something", "get satisfaction from something", "get something out of something", "take pleasure in doing something", "take advantage of an opportunity", "take a risk / take risks", "have a chance to do something", "have the opportunity to do something", "have a go at something"], "context": "Last summer, I **had the chance to** join a climbing club. I decided to **have a go at** climbing and **take a risk**. At first I was nervous, but I **got satisfaction from** overcoming my fear. I **took advantage of** every training session and **got involved in** new activities. I learned a lot **from** the experience."}, {"title": "Taking risks & setting limits", "emoji": "🧗", "words": ["push your limits", "take calculated risks", "leave your comfort zone", "face a challenge", "overcome difficulties", "a positive / negative risk", "consider the consequences", "make a responsible decision"], "context": "Some teenagers enjoy adventures because they want to **push their limits** and **leave their comfort zone**. However, not all risks are positive. Before you **take a risk**, you should **consider the consequences** and make a **responsible decision**. A good challenge can build confidence without putting anyone in danger."}, {"title": "Inspiration and challenges", "emoji": "🏄", "words": ["inspire / motivate someone", "encourage someone to do something", "overcome an obstacle", "achieve a goal", "face a difficult situation", "learn from a mistake", "keep trying / give up", "feel proud of an achievement"], "context": "An inspiring athlete can **motivate** young people to **achieve their goals**. Athletes often **face difficult situations** and must **overcome obstacles**. Even when they make mistakes, they **keep trying** instead of **giving up**. Their stories **encourage** others to believe in themselves and work hard."}], "grammar": [{"title": "Grammar 1 · First and second conditionals", "rule": "First conditional: real possible future. Second conditional: imaginary/unlikely present or future. In if-clauses, do not use “will” or “would” for these standard patterns.", "forms": ["First: If + present simple, will / may / might + V", "Second: If + past simple, would / could / might + V", "If I were you, I would + V"], "examples": ["If you **practice**, you **will improve**.", "If I **had** more time, I **would learn** surfing.", "If I **were** you, I **would wear** a helmet."], "qs": [["If she trains hard, she ___ (win) the race.", "will win"], ["If I had a bike, I ___ (ride) to school.", "would ride"], ["If it ___ (rain), we will stay home.", "rains"], ["If he were braver, he ___ (try) surfing.", "would try"], ["If you don’t sleep enough, you ___ (feel) tired.", "will feel"], ["If I ___ (be) you, I would ask for help.", "were"]]}, {"title": "Grammar 2 · Third conditional", "rule": "Use the third conditional to imagine a different past: an action didn’t happen, and the result also didn’t happen.", "forms": ["If + past perfect, would have + V3", "If + had + V3, could / might have + V3"], "examples": ["If she **had trained**, she **would have won**.", "If I **had known**, I **would have helped**.", "If we **had left** earlier, we **might have arrived** on time."], "qs": [["If I had studied, I ___ (pass) the exam.", "would have passed"], ["If she ___ (wear) a helmet, she would have been safer.", "had worn"], ["If we had left earlier, we ___ (catch) the bus.", "would have caught"], ["If he ___ (listen) carefully, he would have understood.", "had listened"], ["If they had trained more, they ___ (win) the match.", "might have won"], ["If I had seen you, I ___ (say) hello.", "would have said"]]}]}];let current=0;const app=document.getElementById('app');
function bold(s){return s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}
function render(){let u=DATA[current];document.documentElement.style.setProperty('--accent',u.color);document.getElementById('tabs').innerHTML=DATA.map((x,i)=>`<button class="tab ${i===current?'active':''}" onclick="setUnit(${i})">Unit ${x.id} · ${x.title}</button>`).join('');app.innerHTML=`<section class="hero"><small>SHAPE IT! 4 · A2–B1 · UNIT ${u.id}</small><h2>${u.title}</h2><p>${u.subtitle}</p><p class="note">Study the spidergram → translate the three short contexts → study grammar → complete the practice.</p></section><h2 class="section-title">🕸️ Vocabulary spidergram</h2><div class="map">${u.branches.map(b=>`<article class="branch"><h3>${b.emoji} ${b.title}</h3><div class="words">${b.words.map(w=>`<span class="word">${w}</span>`).join('')}</div></article>`).join('')}<div class="center">UNIT ${u.id}<br>${u.title}</div></div><h2 class="section-title">📖 Trigger & context · Translation practice</h2><p class="note">Read each paragraph, underline the key vocabulary, then translate into Vietnamese. Use the branch above to check meanings.</p><div class="context-grid">${u.branches.map((b,i)=>`<div class="context"><h3>Branch ${i+1} · ${b.title}</h3><div>${bold(b.context)}</div><div class="tip">Task: Translate into Vietnamese. Then summarize the paragraph in 2 English sentences.</div></div>`).join('')}</div><h2 class="section-title">🧠 Grammar in action + practice</h2>${u.grammar.map((g,j)=>`<section class="grammar" id="g${j}"><h3>${g.title}</h3><p>${g.rule}</p><div class="forms"><b>Form</b><div>${g.forms.map(x=>`• ${x}`).join('<br>')}</div></div><div class="eg"><b>Examples</b><div>${g.examples.map(x=>`<p>${bold(x)}</p>`).join('')}</div></div><h4>Practice · Complete each sentence</h4>${g.qs.map((q,k)=>`<div class="question" id="q${j}-${k}"><label>${k+1}. ${q[0]}</label><input aria-label="Answer ${k+1}" id="a${j}-${k}" autocomplete="off" placeholder="Type your answer"/><span class="feedback" id="f${j}-${k}"></span></div>`).join('')}<div class="actions"><button class="action" onclick="check(${j})">Check answers</button><button class="action secondary" onclick="reveal(${j})">Show answers</button><button class="action secondary" onclick="resetQuiz(${j})">Try again</button><span class="score" id="score${j}"></span></div></section>`).join('')}<p class="note">Source: Shape It! 4 Student's Book, Units 4–6. Vocabulary and grammar topics follow the textbook; paragraphs and exercises are newly written for classroom use. Some extension vocabulary is added for A2–B1 practice.</p>`}
function setUnit(n){current=n;render();window.scrollTo(0,0)}
function norm(s){return s.toLowerCase().trim().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'')}
function check(j){let g=DATA[current].grammar[j],n=0;g.qs.forEach((q,k)=>{let input=document.getElementById(`a${j}-${k}`),parent=document.getElementById(`q${j}-${k}`),right=norm(input.value)===norm(q[1]);parent.classList.toggle('correct',right);parent.classList.toggle('wrong',!right);document.getElementById(`f${j}-${k}`).textContent=right?'✓ Correct':'✕ Try again';if(right)n++});document.getElementById(`score${j}`).textContent=`Score: ${n}/${g.qs.length}`}
function reveal(j){DATA[current].grammar[j].qs.forEach((q,k)=>{document.getElementById(`a${j}-${k}`).value=q[1];document.getElementById(`f${j}-${k}`).textContent='Answer shown';document.getElementById(`q${j}-${k}`).className='question'});document.getElementById(`score${j}`).textContent='Answers shown'}
function resetQuiz(j){DATA[current].grammar[j].qs.forEach((q,k)=>{document.getElementById(`a${j}-${k}`).value='';document.getElementById(`f${j}-${k}`).textContent='';document.getElementById(`q${j}-${k}`).className='question'});document.getElementById(`score${j}`).textContent=''}
render();
</script></body></html>
